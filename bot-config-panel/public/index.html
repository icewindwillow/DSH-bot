<body><div class="app-shell">
<aside class="sidebar"><div class="brand"><div class="brandmark">易</div><div><h1>小易控制台</h1><small>BOT COMMAND CENTER</small></div></div><div class="nav-label">工作台</div><nav class="modern-nav"><button id="tabHome" class="active"><span class="ico">⌂</span><span>总览</span></button><button id="tabSettings"><span class="ico">⚙</span><span>系统设置</span></button><button id="tabPersona"><span class="ico">◎</span><span>人格设定</span></button><button id="tabPeople"><span class="ico">♧</span><span>群成员档案</span></button><button id="tabMemories"><span class="ico">✦</span><span>私人记忆</span></button></nav><div class="nav-label" style="margin-top:25px">资源</div><nav class="modern-nav"><button id="tabGallery"><span class="ico">▧</span><span>图库</span></button><button id="tabEvents"><svg class="ico icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-7 4 14 2-7h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>事件追踪</span></button><button id="tabInterest"><svg class="ico icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>群兴趣</span></button></nav><div class="side-bottom"><div class="mini-status"><div class="row"><span>运行状态</span><span class="online"><i></i><span id="sideBotStatus">检测中</span></span></div><p>最后同步 · 刚刚</p></div></div></aside>
<div class="app-main"><header><div class="topbar"><div class="crumb">工作台 <span style="margin:0 7px;color:#d1ced8">/</span> <strong id="pageCrumb">总览</strong></div><div class="top-actions"><button class="icon-btn" title="重新读取" id="btnReload">↻</button><button class="icon-btn" title="重启机器人" id="btnRestart">↯</button><span class="pill" id="botPill"><span class="dot"></span><span id="botText">检测中…</span></span><span id="cfgPath" aria-hidden="true"></span><span class="pill" id="modelPill"><span class="dot"></span><span id="modelText">模型状态…</span></span><div class="profile" id="staticProfile" hidden><div class="avatar">I</div><span>Icewind</span><span style="color:#718493">⌄</span></div><div class="profile" id="homeProfile"><button type="button" id="homeNameButton" aria-haspopup="dialog" aria-label="修改首页显示名称"><span class="avatar" id="homeNameAvatar" aria-hidden="true">I</span><span id="homeHeaderName">Icewind</span><span aria-hidden="true">⌄</span></button></div></div></div></header>
