name: Publish versioned source package
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify the package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          npm run package:release -- "${RUNNER_TEMP}/dsh-release" "$RELEASE_TAG"
          cd "${RUNNER_TEMP}/dsh-release"
          sha256sum --check --strict -- ./*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-bot-release
          path: ${{ runner.temp }}/dsh-release/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-bot-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check --strict -- ./*.sha256
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes -- ./*.tar.gz ./*.sha256
