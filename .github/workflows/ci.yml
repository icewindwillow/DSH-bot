name: Check public source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run security:check
      - name: Check executable entry points
        run: |
          node --check patch-qqbot.mjs
          node --check bot-config-panel/server.mjs
          node --check scripts/start-bot.mjs
          node --check scripts/init-profile.mjs
