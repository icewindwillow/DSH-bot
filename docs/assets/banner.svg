<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">DSH-bot · 有性格、有记忆、懂得适时安静</title>
  <desc id="desc">面向 QQ 群聊的 AI 机器人增强系统，包含群聊人格、选择性记忆、事件追踪和本地控制台。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="0.56" stop-color="#e8efff"/>
      <stop offset="1" stop-color="#dff7f1"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5c77ff"/>
      <stop offset="1" stop-color="#7d9cff"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#627cff"/>
      <stop offset="1" stop-color="#61c9d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6274aa" flood-opacity=".18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="36" fill="url(#bg)"/>
  <circle cx="1390" cy="90" r="210" fill="#aebdff" opacity=".28" filter="url(#soft)"/>
  <circle cx="1360" cy="510" r="240" fill="#8ee7d2" opacity=".22" filter="url(#soft)"/>
  <path d="M0 430 C250 350 390 540 650 452 S1050 315 1600 410 V560 H0Z" fill="#fff" opacity=".34"/>

  <g transform="translate(88 118)">
    <rect width="210" height="210" rx="60" fill="url(#brand)" filter="url(#shadow)"/>
    <path d="M35 103 C35 54 79 36 119 43 C151 48 169 71 169 104 C198 101 211 83 224 69 C232 100 216 130 178 137 C164 168 131 180 97 177 C59 173 35 150 35 103Z" fill="url(#whale)" transform="translate(-8 -2) scale(.8)"/>
    <path d="M69 116 C96 139 125 143 151 119 C141 151 112 158 87 142Z" fill="#e7fbff" opacity=".9"/>
    <circle cx="91" cy="93" r="6" fill="#233866"/>
    <path d="M120 70 Q116 48 105 43 M121 69 Q131 48 143 48" fill="none" stroke="#b6f4ef" stroke-width="7" stroke-linecap="round"/>
    <circle cx="174" cy="61" r="6" fill="#e8ffff" opacity=".78"/>
    <circle cx="188" cy="42" r="3" fill="#e8ffff" opacity=".5"/>
    <text x="105" y="198" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" letter-spacing="3">QQ 群聊增强系统</text>
  </g>

  <g fill="#172c59" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="350" y="168" font-size="70" font-weight="800" letter-spacing="-2">DSH-bot</text>
    <text x="354" y="226" font-size="31" font-weight="600" fill="#35548d">让 QQ 机器人更像一位群友</text>
    <text x="356" y="272" font-size="20" fill="#6f83a8">有性格 · 有记忆 · 懂得适时安静</text>
  </g>

  <g transform="translate(350 322)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16">
    <g><rect width="126" height="42" rx="21" fill="#fff" opacity=".78"/><circle cx="25" cy="21" r="7" fill="#607cff"/><text x="43" y="27" fill="#35548d">群聊人格</text></g>
    <g transform="translate(140)"><rect width="144" height="42" rx="21" fill="#fff" opacity=".78"/><circle cx="25" cy="21" r="7" fill="#61bca8"/><text x="43" y="27" fill="#35548d">选择性记忆</text></g>
    <g transform="translate(298)"><rect width="126" height="42" rx="21" fill="#fff" opacity=".78"/><circle cx="25" cy="21" r="7" fill="#f3ae73"/><text x="43" y="27" fill="#35548d">事件追踪</text></g>
    <g transform="translate(438)"><rect width="144" height="42" rx="21" fill="#fff" opacity=".78"/><circle cx="25" cy="21" r="7" fill="#8f7cf4"/><text x="43" y="27" fill="#35548d">本地控制台</text></g>
  </g>

  <g transform="translate(1030 72)" filter="url(#shadow)">
    <rect width="470" height="390" rx="28" fill="#fff" opacity=".94"/>
    <rect width="470" height="54" rx="28" fill="#fff"/>
    <circle cx="29" cy="27" r="7" fill="#62b99b"/><text x="48" y="33" fill="#4c698f" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">小易控制台</text>
    <text x="350" y="33" fill="#8092b1" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">系统健康度</text>
    <rect x="24" y="82" width="422" height="92" rx="18" fill="#f6f8ff"/>
    <text x="45" y="112" fill="#6d83a5" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">今日收到消息</text>
    <text x="45" y="151" fill="#243e70" font-size="34" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">1,240</text>
    <text x="160" y="149" fill="#7e91b0" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">条 · 运行中</text>
    <rect x="24" y="198" width="422" height="150" rx="18" fill="#fbfcff" stroke="#e0e8fa"/>
    <text x="45" y="229" fill="#6d83a5" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">消息活动 · 最近 7 天</text>
    <path d="M47 312 L112 284 L170 300 L235 259 L300 277 L365 232 L423 255" fill="none" stroke="#7187a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 327 L112 319 L170 323 L235 294 L300 303 L365 277 L423 288" fill="none" stroke="#b9d4f2" stroke-width="4" stroke-dasharray="8 9" stroke-linecap="round"/>
    <line x1="47" y1="335" x2="423" y2="335" stroke="#e1e8f4"/>
  </g>
</svg>
